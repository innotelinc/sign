name: docker

# Publishes the fork's OpenSign and OpenSignServer images to GHCR
# (ghcr.io/innotelinc/<image>), using the workflow's built-in GITHUB_TOKEN —
# no Docker Hub credentials involved.
#
# Why not Docker Hub: the upstream workflow pushed to the opensign/*
# namespaces, which this fork cannot push to even with credentials (the
# namespaces belong to the upstream org). The estate's docker-compose consumes
# those same opensign/* tags, so publishing the fork's builds to GHCR under
# the org namespace keeps the fork's images available without touching
# upstream's.
#
# Triggered on main/staging pushes; multi-arch (amd64 + arm64).

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - 'main'
      - 'staging'

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: innotelinc/opensign
            dockerfile: apps/OpenSign/Dockerhubfile
          - image: innotelinc/opensignserver
            dockerfile: apps/OpenSignServer/Dockerhubfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ matrix.image }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
